<div class="app-wrapper">
  <app-mobile-header (menuClick)="openMobileSidebar()"></app-mobile-header>

  <main class="app-main-content">
    <aside class="sidebar-column desktop-only">
      <app-sidebar></app-sidebar>
    </aside>

    <div
      #centerFeed
      class="center-feed"
      [class.center-feed--workspace]="contentMode() === 'workspace'"
      [style.--content-max-width]="contentMaxWidth()">
      <router-outlet></router-outlet>
    </div>

    <aside class="right-sidebar desktop-only">
      <app-right-sidebar></app-right-sidebar>
    </aside>
  </main>

  <!-- Chat Windows Container -->
  <div class="chat-windows-container d-flex flex-row-reverse align-items-end gap-2 fixed-bottom pe-3 pb-0" style="z-index: 1050; pointer-events: none; right: 300px;">
    @for (chat of chatManager.activeChats(); track chat.id) {
      <app-chat-window [targetUser]="chat"></app-chat-window>
    }
  </div>
</div>

@if (mobileSidebarOpen()) {
  <div class="mobile-sidebar-backdrop" (click)="closeMobileSidebar()"></div>
  <div class="mobile-sidebar-panel">
    <div class="mobile-sidebar-header d-flex justify-content-between align-items-center px-3 py-2 border-bottom border-secondary" style="border-bottom-color: var(--border-color) !important;">
      <div (click)="onHomeClick(); closeMobileSidebar()" style="cursor: pointer;">
        <app-brand link="/home" style="pointer-events: none;" />
      </div>
      <button type="button" class="btn btn-link text-reset p-0 m-0 d-inline-flex align-items-center" (click)="closeMobileSidebar()" aria-label="Đóng trình đơn">
        <i class="bi bi-x-lg fs-5"></i>
      </button>
    </div>
    <div class="mobile-sidebar-content">
      <app-sidebar></app-sidebar>
    </div>
  </div>
}

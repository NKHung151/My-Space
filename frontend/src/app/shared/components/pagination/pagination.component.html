@if (totalPages > 1) {
  <nav class="shared-pagination" aria-label="Pagination">
    <button
      class="pagination-button"
      type="button"
      [disabled]="normalizedCurrentPage <= 1"
      aria-label="Trang trước"
      (click)="requestPage(normalizedCurrentPage - 1)">
      <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </button>

    @for (item of items; track trackItem($index, item)) {
      @if (item !== null) {
        <button
          class="pagination-button"
          type="button"
          [class.is-active]="item === normalizedCurrentPage"
          [attr.aria-current]="item === normalizedCurrentPage ? 'page' : null"
          (click)="requestPage(item)">
          {{ item }}
        </button>
      } @else {
        <span class="pagination-gap" aria-hidden="true">...</span>
      }
    }

    <button
      class="pagination-button"
      type="button"
      [disabled]="normalizedCurrentPage >= totalPages"
      aria-label="Trang tiếp theo"
      (click)="requestPage(normalizedCurrentPage + 1)">
      <i class="bi bi-chevron-right" aria-hidden="true"></i>
    </button>
  </nav>
}

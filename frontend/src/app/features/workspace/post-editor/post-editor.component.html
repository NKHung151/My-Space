<div class="simple-editor-page d-flex justify-content-center pt-5 pb-5 px-3">
  <div class="editor-card card border-0 shadow-sm rounded-4 w-100" style="max-width: 600px;">
    <div class="card-body p-4">
      <!-- Header -->
      <header class="d-flex justify-content-between align-items-center mb-3">
        <a href="#" (click)="$event.preventDefault(); goToMyPosts()" class="btn btn-light rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;" aria-label="Đóng">
          <i class="bi bi-x-lg"></i>
        </a>
        <h5 class="m-0 fw-bold">Tạo bài viết</h5>
        <button class="btn btn-accent rounded-pill px-4 fw-bold" [disabled]="isSaving || (!textContent.trim() && mediaAttachments.length === 0)" (click)="saveAndSubmit()">
          {{ saveStateLabel }}
        </button>
      </header>

      <hr class="mb-3">

      <!-- Author Info -->
      <div class="d-flex align-items-center mb-3">
        <img [appAssetImage]="authorAvatarUrl" class="rounded-circle me-2 object-fit-cover" width="45" height="45" alt="Avatar">
        <span class="fw-bold">{{ authorDisplayName }}</span>
      </div>


      <!-- Tag Input -->
      <div class="input-group mb-2 editor-tag-group w-50">
        <span class="input-group-text border-0 bg-transparent ps-0 fw-bold text-muted" style="padding-right: 4px;">#</span>
        <input type="text" class="form-control border-0 shadow-none px-1 text-primary fw-medium" 
               placeholder="Chủ đề (ví dụ: tech)" [ngModel]="draft.tag" (ngModelChange)="updateTag($event)" maxlength="30">
      </div>

      <!-- Content Textarea -->
      <textarea #postTextarea class="form-control border-0 shadow-none px-0 mb-3 fs-5" rows="3" 
                placeholder="Bạn đang nghĩ gì?" [(ngModel)]="textContent" (input)="onTextContentChange()" style="resize: none; line-height: 1.5;"></textarea>

      <!-- Media Preview Area -->
      <div class="media-preview-container d-flex flex-column gap-2 mb-3">
        @for (media of mediaAttachments; track media.url; let i = $index) {
          <div class="position-relative">
            <button class="btn btn-dark btn-sm rounded-circle position-absolute top-0 end-0 m-2 z-1 shadow" (click)="removeMedia(i)" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
              <i class="bi bi-x fs-5"></i>
            </button>
            @if (media.type === 'image') {
              <img [src]="media.url" class="img-fluid rounded-3 border w-100 object-fit-cover" style="max-height: 400px;">
            } @else {
              <video [src]="media.url" class="w-100 rounded-3 border" style="max-height: 400px; background: #000;" controls></video>
            }
          </div>
        }
      </div>

      <!-- Media Upload Controls -->
      <div class="border rounded-3 p-2 px-3 d-flex align-items-center justify-content-between">
        <span class="fw-bold text-muted fs-6">Thêm vào bài viết</span>
        <div class="d-flex gap-1">
          <!-- Hidden file inputs -->
          <input type="file" #imageInput hidden accept="image/*" (change)="uploadMedia('image', $event)">
          <input type="file" #videoInput hidden accept="video/*" (change)="uploadMedia('video', $event)">
          
          <button class="btn btn-light rounded-circle text-success d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;" title="Thêm ảnh" (click)="imageInput.click()">
            <i class="bi bi-images fs-4"></i>
          </button>
          <button class="btn btn-light rounded-circle text-danger d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;" title="Thêm video" (click)="videoInput.click()">
            <i class="bi bi-camera-video fs-4"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
